name: Docker

# Builds and publishes multi-arch (amd64 + arm64) container images to both
# ghcr.io and Docker Hub. Triggered by version tags (v*) or manually.
#
# Required Secrets (Docker Hub only):
#   DOCKERHUB_USERNAME - Docker Hub account owning the namespace
#   DOCKERHUB_TOKEN    - Docker Hub access token (not the password)
# ghcr.io uses the built-in GITHUB_TOKEN, no extra secret needed.
#
# NOTE: The Docker Hub namespace (euforest) must exist first. Override
# DOCKERHUB_IMAGE below if you change the namespace.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, e.g. v1.0.9 (without leading v is also accepted)"
        required: true
        default: "v1.0.9"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    # Expose secret presence as a plain env var so it can be referenced in
    # `if:` conditions and expressions. (The `secrets` context itself cannot
    # be used directly in step `if:` conditions.)
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and image refs
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            # GITHUB_REF_NAME is the tag name (e.g. v1.0.9) on tag push
            v="${GITHUB_REF_NAME:-}"
          fi
          case "$v" in
            v*) ;;
            *) v="v$v" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # ghcr.io requires lowercase repository names; github.repository may
          # contain uppercase chars (e.g. NPanel-backend).
          ghcr="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_image=$ghcr" >> "$GITHUB_OUTPUT"

          echo "dockerhub_image=euforest/npanel-backend" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$v  ghcr=$ghcr"
        env:
          DOCKERHUB_IMAGE: euforest/npanel-backend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        # Only push to Docker Hub when secrets are configured; otherwise skip
        # gracefully so ghcr.io-only setups still work.
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # ghcr.io always; Docker Hub only when its secrets exist.
          tags: |
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr_image }}:latest
            ${{ env.HAS_DOCKERHUB == 'true' && format('{0}:{1}', steps.meta.outputs.dockerhub_image, steps.meta.outputs.version) || '' }}
            ${{ env.HAS_DOCKERHUB == 'true' && format('{0}:latest', steps.meta.outputs.dockerhub_image) || '' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # Disable default provenance/attestation so the multi-arch manifest
          # stays clean and pulls correctly on older Docker daemons.
          provenance: false
          push: true

      - name: Summary
        run: |
          {
            echo "### Published images"
            echo ""
            echo "- \`${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}\`"
            echo "- \`${{ steps.meta.outputs.ghcr_image }}:latest\`"
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "- \`${{ steps.meta.outputs.dockerhub_image }}:${{ steps.meta.outputs.version }}\`"
              echo "- \`${{ steps.meta.outputs.dockerhub_image }}:latest\`"
            fi
            echo ""
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
