services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: npanel
      POSTGRES_USER: npanel
      POSTGRES_PASSWORD: npanel_password
      TZ: UTC
    volumes:
      - npanel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npanel -d npanel"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - npanel_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  npanel:
    build:
      context: .
      args:
        VERSION: ${NPANEL_VERSION:-v1.0.9}
    image: npanel:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${NPANEL_HTTP_PORT:-8081}:8081"
      - "${NPANEL_GRPC_PORT:-9012}:9012"
    volumes:
      - ./configs/config.postgres.yaml:/data/conf/config.yaml:ro
      - npanel_logs:/app/logs
      - npanel_uploads:/app/uploads
    environment:
      NPANEL_UPLOAD_DIR: /app/uploads

volumes:
  npanel_postgres:
  npanel_redis:
  npanel_logs:
  npanel_uploads:
